name: Build PhoenyxCore Kernel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      compiler:
        description: "Select Compiler"
        required: true
        default: "GreenForce-Clang"
        type: choice
        options:
          - "GreenForce-Clang"
          - "AOSP-Clang"
      version:
        description: "Kernel version (with or without the v prefix)"
        required: true
        type: string
      create_release:
        description: "Create GitHub Release"
        type: boolean
        default: true
      post_to_telegram:
        description: "Post build notifications to Telegram"
        required: true
        type: boolean
        default: true
      branch:
        description: "Select branch to build"
        required: true
        default: "lineage-24.0"
        type: choice
        options:
          - "lineage-24.0"
          - "lineage-24.0-dev"
      dependencies_branch:
        description: "Select branch for device trees and modules"
        required: true
        default: "lineage-24.0"
        type: choice
        options:
          - "lineage-24.0"
      device:
        description: "Select device to build"
        required: true
        default: "cupid"
        type: choice
        options:
          - "all"
          - "cupid"
          - "zeus"
          - "mayfly"
          - "unicorn"
          - "diting"
          - "thor"
          - "marble"
          - "mondrian"

jobs:
  Build-PhoenyxCore:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout PhoenyxCore Builder
        uses: actions/checkout@v4

      - name: 📣 Notify Telegram - Build started
        if: ${{ github.event_name == 'push' || inputs.post_to_telegram }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION_INPUT: ${{ inputs.version || github.ref_name }}
          COMPILER_INPUT: ${{ inputs.compiler || 'GreenForce-Clang' }}
          BRANCH_INPUT: ${{ inputs.branch || 'lineage-24.0' }}
          DEVICE_INPUT: ${{ inputs.device || 'cupid' }}
          CREATE_RELEASE_INPUT: ${{ inputs.create_release || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing."
            exit 1
          fi

          version="${VERSION_INPUT#v}"
          message="$(printf '🚧 PhoenyxCore build started\nVersion: v%s\nBranch: %s\nDevice(s): %s\nCompiler: %s\nCreate release: %s\nWorkflow: https://github.com/%s/actions/runs/%s' \
            "${version}" "${BRANCH_INPUT}" "${DEVICE_INPUT}" "${COMPILER_INPUT}" \
            "${CREATE_RELEASE_INPUT:-false}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"

          if ! response="$(curl --silent --show-error --fail-with-body \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")"; then
            echo "::warning::Telegram start notification could not be sent."
            exit 1
          fi
          if ! jq -e '.ok == true' <<< "${response}" >/dev/null; then
            echo "::warning::Telegram API rejected the start notification."
            exit 1
          fi

      - name: ⏰ Prepare timezone
        run: |
          sudo ln -sf /usr/share/zoneinfo/America/Sao_Paulo /etc/localtime

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc cpio flex bison git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev libelf-dev dwarves zip zstd

      - name: ⚙️ Setup Environment
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ -n "${VERSION_INPUT}" ]]; then
            VERSION="${VERSION_INPUT#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "${VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid version '${VERSION}'. Use letters, numbers, dots, underscores, or hyphens."
            exit 1
          fi

          BUILD_EPOCH="$(date +%s)"
          BUILD_TIME="$(TZ=America/Sao_Paulo date -d "@${BUILD_EPOCH}" '+%d%m%Y-%H%M')"
          BUILD_DATE="$(TZ=America/Sao_Paulo date -d "@${BUILD_EPOCH}" '+%b %d %Y %H:%M')"
          BUILD_TIMESTAMP="$(TZ=America/Sao_Paulo date -d "@${BUILD_EPOCH}" '+%a %b %d %H:%M:%S %Z %Y')"

          {
            echo "VERSION=${VERSION}"
            echo "VERSION_TAG=v${VERSION}"
            echo "BUILD_TIME=${BUILD_TIME}"
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}"
          } >> "$GITHUB_ENV"

      - name: 🔧 Setup Compiler
        shell: bash
        run: |
          set -e
          mkdir -p clang

          if [[ "${{ github.event.inputs.compiler }}" == "AOSP-Clang" ]]; then
            echo "Using AOSP Clang mirror..."
            CLANG_URL=$(curl -fsSL https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest | grep "browser_download_url" | grep -E 'clang-.*\.tar\.gz' | head -n 1 | cut -d '"' -f 4)
            echo "Downloading: $CLANG_URL"
            curl -L "$CLANG_URL" -o clang.tar.gz
            tar -C clang -xf clang.tar.gz
            rm -f clang.tar.gz
          else
            echo "Using GreenForce Clang..."
            CLANG_URL=$(curl -fsSL https://api.github.com/repos/greenforce-project/greenforce_clang/releases/latest | grep "browser_download_url" | grep "gf-clang" | head -n 1 | cut -d '"' -f 4)
            echo "Downloading: $CLANG_URL"
            curl -L "$CLANG_URL" -o greenforce-clang.tar.zst
            tar -C clang -xf greenforce-clang.tar.zst
            rm -f greenforce-clang.tar.zst
          fi

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "Compiler version:"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | sed -n '1p'
          "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | sed -n '1p'

      - name: Clone PhoenyxCore Source (Based on LineageOS Xiaomi SM8450)
        env:
          SOURCE_BRANCH: ${{ inputs.branch || 'lineage-24.0' }}
          DEPENDENCIES_BRANCH: ${{ inputs.dependencies_branch || 'lineage-24.0' }}
        run: |
          git clone --depth=1 https://github.com/Joshabys-Xiaomi-12-Org/android_kernel_xiaomi_sm8450.git -b "${SOURCE_BRANCH}" kernel/xiaomi/sm8450
          cd kernel/xiaomi/sm8450
          echo "Kernel commit: $(git rev-parse HEAD)"

      - name: 💾 Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: 🛠️ Build Kernel
        shell: bash
        env:
          DEVICE_INPUT: ${{ inputs.device || 'cupid' }}
        run: |
          set -euo pipefail
          cd kernel/xiaomi/sm8450
          export PATH="${CLANG_PATH}/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Joshaby
          export KBUILD_BUILD_HOST=LineageOS
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld

          # Free runner disk
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift || true
          free -h

          if [[ "${DEVICE_INPUT}" == "all" ]]; then
            devices=(cupid zeus mayfly unicorn diting thor marble mondrian)
          else
            devices=("${DEVICE_INPUT}")
          fi

          for device in "${devices[@]}"; do
            echo "::group::Building kernel for ${device}"
            out_dir="out-${device}"
            mkdir -p "${out_dir}"
            make O="${out_dir}" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

            ./scripts/kconfig/merge_config.sh -O "${out_dir}" -m "${out_dir}/.config" \
              arch/arm64/configs/vendor/waipio_GKI.config \
              arch/arm64/configs/vendor/xiaomi_GKI.config \
              arch/arm64/configs/vendor/debugfs.config \
              "arch/arm64/configs/vendor/${device}_GKI.config"

            ./scripts/config --file "${out_dir}/.config" \
              -d LTO_CLANG \
              -d LTO_NONE \
              -d THINLTO \
              -d ARCH_SUPPORTS_LTO_CLANG \
              -d ARCH_SUPPORTS_LTO_CLANG_THIN \
              -d HAS_LTO_CLANG \
              -e LTO_CLANG_THIN

            ./scripts/config --file "${out_dir}/.config" \
              --set-str LOCALVERSION "" \
              --set-str LOCALVERSION_AUTO "n"

            sed -i '217s/^[[:space:]]*echo "$res"[[:space:]]*$/res="${res\/-gki+\/}"\necho "$res"/' scripts/setlocalversion

            make O="${out_dir}" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
            echo "Kernel release: $(make O="${out_dir}" ARCH=arm64 LLVM=1 LLVM_IAS=1 -s kernelrelease)"
            make -j"$(nproc --all)" O="${out_dir}" ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

            image="${out_dir}/arch/arm64/boot/Image"
            if [[ ! -s "${image}" ]]; then
              echo "::error::Built Image not found for ${device}!"
              exit 1
            fi
            ls -lh "${image}"
            echo "::endgroup::"
          done

      - name: 📂 Package AnyKernel3 ZIP
        env:
          DEVICE_INPUT: ${{ inputs.device || 'cupid' }}
        run: |
          set -euo pipefail
          if [[ "${DEVICE_INPUT}" == "all" ]]; then
            devices=(cupid zeus mayfly unicorn diting thor marble mondrian)
          else
            devices=("${DEVICE_INPUT}")
          fi

          mkdir -p release-pkg
          for device in "${devices[@]}"; do
            package_dir="ak3-pkg-${device}"
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${package_dir}"
            cp "kernel/xiaomi/sm8450/out-${device}/arch/arm64/boot/Image" "${package_dir}/Image"
            cp -f ak3/anykernel.sh "${package_dir}/anykernel.sh"
            sed -i "s|^kernel\\.string=TITLE$|kernel.string=PhoenyxCore ${VERSION_TAG} (${device}) - Build ${BUILD_DATE} - By tg@Joshaby (http://t.me/Joshaby)|" "${package_dir}/anykernel.sh"

            zip_name="PhoenyxCore-${VERSION_TAG}-${device}-${BUILD_TIME}.zip"
            (cd "${package_dir}" && zip -r9 "../${zip_name}" . -x ".git/*" "README.md")
            sha256sum "${zip_name}" > "${zip_name}.sha256"
            mv "${zip_name}" "${zip_name}.sha256" release-pkg/
          done

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenyxCore-${{ env.VERSION_TAG }}-${{ env.BUILD_TIME }}
          path: release-pkg/*

      - name: 🚀 Publish GitHub Release
        if: ${{ inputs.create_release || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_TAG="${VERSION_TAG}-${BUILD_TIME}"
          RELEASE_TITLE="PhoenyxCore ${VERSION_TAG} - ${BUILD_DATE}"
          gh release create "${REL_TAG}" \
            release-pkg/* \
            --title "${RELEASE_TITLE}" \
            --notes "PhoenyxCore ${VERSION_TAG} build ${BUILD_DATE}"

      - name: 📣 Notify Telegram - Build result
        if: ${{ always() && (github.event_name == 'push' || inputs.post_to_telegram) }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          VERSION_INPUT: ${{ inputs.version || github.ref_name }}
          COMPILER_INPUT: ${{ inputs.compiler || 'GreenForce-Clang' }}
          BRANCH_INPUT: ${{ inputs.branch || 'lineage-24.0' }}
          DEVICE_INPUT: ${{ inputs.device || 'cupid' }}
          CREATE_RELEASE_INPUT: ${{ inputs.create_release || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing."
            exit 1
          fi

          version="${VERSION_INPUT#v}"
          version_tag="${VERSION_TAG:-v${version}}"
          build_time="${BUILD_TIME:-unknown}"
          build_date="${BUILD_DATE:-unavailable}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "${JOB_STATUS}" == "success" ]]; then
            if [[ "${CREATE_RELEASE_INPUT}" == "true" ]]; then
              release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${version_tag}-${build_time}"
              message="$(printf '✅ PhoenyxCore build completed successfully\nVersion: %s\nBranch: %s\nDevice(s): %s\nCompiler: %s\nBuild date: %s\nRelease: %s' \
                "${version_tag}" "${BRANCH_INPUT}" "${DEVICE_INPUT}" "${COMPILER_INPUT}" \
                "${build_date}" "${release_url}")"
            else
              message="$(printf '✅ PhoenyxCore build completed successfully\nVersion: %s\nBranch: %s\nDevice(s): %s\nCompiler: %s\nBuild date: %s\nRelease was not requested.\nWorkflow/artifacts: %s' \
                "${version_tag}" "${BRANCH_INPUT}" "${DEVICE_INPUT}" "${COMPILER_INPUT}" \
                "${build_date}" "${run_url}")"
            fi
          else
            message="$(printf '❌ PhoenyxCore build failed (status: %s)\nVersion: %s\nBranch: %s\nDevice(s): %s\nCompiler: %s\nBuild date: %s\nLogs: %s' \
              "${JOB_STATUS}" "${version_tag}" "${BRANCH_INPUT}" "${DEVICE_INPUT}" \
              "${COMPILER_INPUT}" "${build_date}" "${run_url}")"
          fi

          if ! response="$(curl --silent --show-error --fail-with-body \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")"; then
            echo "::warning::Telegram result notification could not be sent."
            exit 1
          fi
          if ! jq -e '.ok == true' <<< "${response}" >/dev/null; then
            echo "::warning::Telegram API rejected the result notification."
            exit 1
          fi