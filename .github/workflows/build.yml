name: Build PhoenyxCore Kernel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      compiler:
        description: "Select Compiler"
        required: true
        default: "GreenForce-Clang"
        type: choice
        options:
          - "GreenForce-Clang"
          - "AOSP-Clang"
      version:
        description: "Kernel version (with or without the v prefix)"
        required: true
        type: string
      create_release:
        description: "Create GitHub Release"
        type: boolean
        default: true
      branch:
        description: "Select branch to build"
        required: true
        default: "lineage-24.0"
        type: choice
        options:
          - "lineage-24.0"
          - "lineage-24.0-dev"
      device:
        description: "Select device to build"
        required: true
        default: "cupid"
        type: choice
        options:
          - "cupid"
          - "zeus"
          - "mayfly"
          - "unicorn"
          - "diting"
          - "thor"
          - "mondrian"

jobs:
  Build-PhoenyxCore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout PhoenyxCore Builder
        uses: actions/checkout@v4

      - name: ⏰ Prepare timezone
        run: |
          sudo ln -sf /usr/share/zoneinfo/America/Sao_Paulo /etc/localtime

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc cpio flex bison git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev libelf-dev dwarves zip zstd

      - name: ⚙️ Setup Environment
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ -n "${VERSION_INPUT}" ]]; then
            VERSION="${VERSION_INPUT#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "${VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid version '${VERSION}'. Use letters, numbers, dots, underscores, or hyphens."
            exit 1
          fi

          BUILD_EPOCH="$(date +%s)"
          BUILD_TIME="$(TZ=America/Sao_Paulo date -d "@${BUILD_EPOCH}" '+%d%m%Y-%H%M')"
          BUILD_DATE="$(TZ=America/Sao_Paulo date -d "@${BUILD_EPOCH}" '+%b %d %Y %H:%M')"
          BUILD_TIMESTAMP="$(TZ=America/Sao_Paulo date -d "@${BUILD_EPOCH}" '+%a %b %d %H:%M:%S %Z %Y')"

          {
            echo "VERSION=${VERSION}"
            echo "VERSION_TAG=v${VERSION}"
            echo "BUILD_TIME=${BUILD_TIME}"
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}"
          } >> "$GITHUB_ENV"

      - name: 🔧 Setup Compiler
        shell: bash
        run: |
          set -e
          mkdir -p clang

          if [[ "${{ github.event.inputs.compiler }}" == "AOSP-Clang" ]]; then
            echo "Using AOSP Clang mirror..."
            CLANG_URL=$(curl -fsSL https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest | grep "browser_download_url" | grep -E 'clang-.*\.tar\.gz' | head -n 1 | cut -d '"' -f 4)
            echo "Downloading: $CLANG_URL"
            curl -L "$CLANG_URL" -o clang.tar.gz
            tar -C clang -xf clang.tar.gz
            rm -f clang.tar.gz
          else
            echo "Using GreenForce Clang..."
            CLANG_URL=$(curl -fsSL https://api.github.com/repos/greenforce-project/greenforce_clang/releases/latest | grep "browser_download_url" | grep "gf-clang" | head -n 1 | cut -d '"' -f 4)
            echo "Downloading: $CLANG_URL"
            curl -L "$CLANG_URL" -o greenforce-clang.tar.zst
            tar -C clang -xf greenforce-clang.tar.zst
            rm -f greenforce-clang.tar.zst
          fi

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "Compiler version:"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | sed -n '1p'
          "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | sed -n '1p'

      - name: Clone PhoenyxCore Source (Based on LineageOS Xiaomi SM8450)
        run: |
          git clone --depth=1 https://github.com/Joshabys-Xiaomi-12-Org/android_kernel_xiaomi_sm8450.git -b "${{ github.event.inputs.branch }}" kernel/xiaomi/sm8450
          cd kernel/xiaomi/sm8450
          echo "Kernel commit: $(git rev-parse HEAD)"

      - name: 💾 Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: 🛠️ Build Kernel
        shell: bash
        run: |
          set -e
          cd kernel/xiaomi/sm8450
          export PATH="${CLANG_PATH}/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Joshaby
          export KBUILD_BUILD_HOST=LineageOS
          export KBUILD_BUILD_TIMESTAMP="${BUILD_TIMESTAMP}"
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld

          # Free runner disk
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift || true
          free -h

          # 1. Base GKI defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          # 2. Merge vendor fragments for cupid
          ./scripts/kconfig/merge_config.sh -O out -m out/.config \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/"${{ github.event.inputs.device }}"_GKI.config

          # 4. Brand localversion
          ./scripts/config --file out/.config --set-str LOCALVERSION "-PhoenyxCore.LTO.v${VERSION_TAG}"

          # 5. ThinLTO config with 2 parallel threads wrapper to prevent link OOM
          # ./scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG -e LTO_CLANG_THIN
          # make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          wrapper="${GITHUB_WORKSPACE}/ld-thinlto-wrapper"
          printf '#!/bin/bash\nexec ld.lld "$@" --thinlto-jobs=2\n' > "${wrapper}"
          chmod +x "${wrapper}"
          export LD="${wrapper}"
          export HOSTLD="${wrapper}"

          # Build Image
          make -j4 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

          if [ ! -s out/arch/arm64/boot/Image ]; then
            echo "::error::Built Image not found!"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image

      - name: 📂 Package AnyKernel3 ZIP
        run: |
          mkdir -p ak3-pkg
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3-pkg
          cp kernel/xiaomi/sm8450/out/arch/arm64/boot/Image ak3-pkg/Image
          cp -f ak3/anykernel.sh ak3-pkg/anykernel.sh
          sed -i "s|^kernel.string=.*|kernel.string=PhoenyxCore v${VERSION_TAG} - Build ${BUILD_DATE} - By tg@Joshaby (http://t.me/Joshaby)|" ak3-pkg/anykernel.sh

          ZIP_NAME="PhoenyxCore-v${VERSION_TAG}-${BUILD_TIME}.zip"
          cd ak3-pkg
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md"
          cd ..
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(cat ${ZIP_NAME}.sha256 | awk '{print $1}')" >> "$GITHUB_ENV"
          mkdir -p release-pkg
          mv "${ZIP_NAME}" release-pkg/
          mv "${ZIP_NAME}.sha256" release-pkg/

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenyxCore v${{ env.VERSION_TAG }} ${{ env.BUILD_TIME }}
          path: release-pkg/*

      - name: 🚀 Publish GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_TAG="v${VERSION_TAG}-${BUILD_TIME}"
          RELEASE_TITLE="PhoenyxCore v${VERSION_TAG} - ${BUILD_DATE}"
          gh release create "${REL_TAG}" \
            release-pkg/* \
            --title "${RELEASE_TITLE}" \
            --notes "PhoenyxCore v${VERSION_TAG} build ${BUILD_DATE}"